<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4" style="max-width:500px;">
        <h1 class="mb-4">Edit Product</h1>
        <form method="POST">
            <div class="mb-2">
                <label>Name</label>
                <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
            </div>
            <div class="mb-2">
                <label>Category</label>
                <select name="category" class="form-select" required>
                    {% for c in ['CPU', 'Motherboard', 'RAM', 'GPU', 'PSU', 'Storage', 'Case'] %}
                    <option {% if product.category == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-2">
                <label>Brand</label>
                <input type="text" name="brand" class="form-control" value="{{ product.brand or '' }}">
            </div>
            <div class="mb-2">
                <label>Price (₹)</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
            </div>
            <div class="mb-2">
                <label>Stock</label>
                <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
            </div>
            <div class="mb-2">
                <label>Image URL</label>
                <input type="text" name="image" class="form-control" value="{{ product.image or '' }}">
            </div>
            <div class="mb-2">
                <label>Socket Type (CPU/Motherboard only)</label>
                <input type="text" name="socket_type" class="form-control" value="{{ product.socket_type or '' }}">
            </div>
            <div class="mb-2">
                <label>RAM Type (RAM/Motherboard only)</label>
                <input type="text" name="ram_type" class="form-control" value="{{ product.ram_type or '' }}">
            </div>
            <div class="mb-2">
                <label>Form Factor (Case/Motherboard only)</label>
                <input type="text" name="form_factor" class="form-control" value="{{ product.form_factor or '' }}">
            </div>
            <div class="mb-2">
                <label>Wattage (PSU/CPU/GPU only)</label>
                <input type="number" name="wattage" class="form-control" value="{{ product.wattage or '' }}">
            </div>
            <button type="submit" class="btn btn-primary mt-2">Save Changes</button>
        </form>
    </div>
</body>
</html>
