<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4" style="max-width:500px;">
        <h1 class="mb-4">Add New Product</h1>
        <form method="POST">
            <div class="mb-2"><label>Name</label><input type="text" name="name" class="form-control" required></div>
            <div class="mb-2">
                <label>Category</label>
                <select name="category" class="form-select" required>
                    <option>CPU</option><option>Motherboard</option><option>RAM</option>
                    <option>GPU</option><option>PSU</option><option>Storage</option><option>Case</option>
                </select>
            </div>
            <div class="mb-2"><label>Brand</label><input type="text" name="brand" class="form-control"></div>
            <div class="mb-2"><label>Price (₹)</label><input type="number" step="0.01" name="price" class="form-control" required></div>
            <div class="mb-2"><label>Stock</label><input type="number" name="stock" class="form-control" required></div>
            <div class="mb-2"><label>Image URL</label><input type="text" name="image" class="form-control"></div>
            <div class="mb-2"><label>Socket Type (CPU/Motherboard only)</label><input type="text" name="socket_type" class="form-control"></div>
            <div class="mb-2"><label>RAM Type (RAM/Motherboard only)</label><input type="text" name="ram_type" class="form-control"></div>
            <div class="mb-2"><label>Form Factor (Case/Motherboard only)</label><input type="text" name="form_factor" class="form-control"></div>
            <div class="mb-2"><label>Wattage (PSU/CPU/GPU only)</label><input type="number" name="wattage" class="form-control"></div>
            <button type="submit" class="btn btn-primary mt-2">Add Product</button>
        </form>
    </div>
</body>
</html>
